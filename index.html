<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#F1ECD2" name="theme-color"/>
<meta content="Shaveers. Modesty in every thread. Launching soon." name="description"/>
<title>Launching Soon | Shaveers</title>


<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&amp;family=DM+Sans:ital,wght@0,400;0,500;1,400&amp;display=swap" media="print" onload="this.media='all'" rel="stylesheet"/>
<style>
:root{--cream:#F1ECD2;--ink:#11100e;--soft:#6b675e;--border:#aba69a;--display:"Bodoni Moda", "Bodoni MT", "Didot", Georgia,serif;--body:"DM Sans",Inter,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,.rail:focus-visible{outline:2px solid #1b1a17;outline-offset:4px}
main{position:relative;isolation:isolate;min-height:100vh;min-height:100svh;padding:28px 0 27px;overflow:hidden;background:radial-gradient(ellipse 46% 42% at 59% 78%,rgba(255,251,236,.58),transparent 87%), radial-gradient(ellipse 38% 36% at 10% 71%,rgba(208,179,140,.20),transparent 84%), radial-gradient(ellipse 55% 42% at 51% 16%,rgba(255,255,242,.47),transparent 85%),var(--cream)}
main::before{content:"";position:absolute;top:-8%;right:-5%;width:min(36vw,580px);height:min(40vw,600px);pointer-events:none;opacity:.19;filter:blur(11px);background:
linear-gradient(119deg,transparent 52%,rgba(98,85,54,.23) 52.5%,transparent 53.2%),
radial-gradient(ellipse 10% 31% at 66% 17%,rgba(112,100,71,.42) 0 50%,transparent 56%),
radial-gradient(ellipse 12% 30% at 82% 30%,rgba(112,100,71,.38) 0 52%,transparent 56%),
radial-gradient(ellipse 10% 28% at 55% 45%,rgba(112,100,71,.42) 0 52%,transparent 59%),
radial-gradient(ellipse 12% 28% at 84% 65%,rgba(112,100,71,.32) 0 52%,transparent 59%);transform:rotate(-18deg);z-index:-1}
.top{display:flex;align-items:center;flex-direction:column;text-align:center;padding:0 22px;position:relative;z-index:2}
.brand{width:clamp(80px,15vw,285px);height:auto;display:block}
h1{font-family:var(--display);font-weight:400;letter-spacing:-.065em;line-height:1.1;font-size:clamp(20px,6.55vw,128px);margin:24px 0 3px;text-wrap:balance}
.lead{font-size:clamp(14px,1.5vw,20px);font-weight:400;font-style:italic;line-height:1.6;letter-spacing:.003em;margin:0;max-width:640px}
.signup{display:flex;align-items:center;width:min(605px,calc(100% - 42px));height:58px;margin-top:29px;border:1px solid #9d9c91;border-radius:100px;background:rgba(255,255,247,.23);overflow:hidden;text-align:left}
.signup input{min-width:0;flex:1;border:none;outline:none;background:none;height:100%;padding:0 32px;font-size:17px;color:var(--ink);font-weight:400}
.signup input::placeholder{color:#8c8c85;opacity:1}
.signup button{color:#fff;background:#0b0a09;border:0;height:100%;padding:0 38px;border-radius:100px;font-size:16px;white-space:nowrap;transition:background .2s}
.signup button:hover{background:#34312e}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,120px);z-index:1000;max-width:calc(100vw - 32px);text-align:center;padding:13px 20px;border-radius:10px;background:#151411;color:#fff;line-height:1.45;font-size:13px;box-shadow:0 12px 45px rgba(0,0,0,.18);opacity:0;transition:transform .25s ease,opacity .25s ease;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.collection{width:100%;position:relative;margin:12px auto 0;}
.rail{display:flex;align-items:flex-start;gap:clamp(12px,1.25vw,24px);width:100%;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;padding:0 calc((100vw - min(100vw,1460px))/2 + 16px) 8px;scroll-snap-type:none;overscroll-behavior-x:contain;scroll-behavior:smooth;touch-action:pan-x pan-y;cursor:grab;user-select:none;min-height:clamp(460px,48.8vw,607px)}
.rail::-webkit-scrollbar{display:none}
.rail.dragging{cursor:grabbing;scroll-snap-type:none;scroll-behavior:auto}
.garment{flex:0 0 clamp(210px,19.4vw,300px);height:clamp(444px,47vw,600px);display:flex;justify-content:center;align-items:flex-start;scroll-snap-align:center;position:relative;overflow:visible}
.garment img{width:auto;max-width:100%;height:auto;max-height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(4px 22px 18px rgba(78,60,39,.09));transition:transform .32s ease;transform-origin:50% 0}
.garment.short img{height:clamp(300px,32vw,417px)}
.garment.long img{height:clamp(440px,47vw,595px)}
@media(hover:hover) and (pointer:fine){.garment:hover img{transform:translateY(-4px)}}
.nav{position:absolute;top:41%;transform:translateY(-50%);z-index:4;width:50px;height:50px;display:grid;place-items:center;border:1px solid rgba(130,118,99,.18);border-radius:50%;background:rgba(249,244,226,.91);box-shadow:0 7px 20px rgba(80,66,47,.10);color:var(--ink);transition:background .2s,transform .2s}
.nav:hover{background:#fff9e8;transform:translateY(-50%) scale(1.045)}
.nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav.prev{left:clamp(22px,5.6vw,83px)}
.nav.next{right:clamp(22px,5.6vw,83px)}
.progress{display:none;justify-content:center;gap:11px;margin:5px 0 10px;position:relative;z-index:2}
.progress .dot{border:0;min-width:9px;width:9px;height:9px;padding:0;border-radius:50%;background:#c7c1ad;transition:background .25s,transform .25s}
.progress .dot[aria-current="true"]{background:#191817;transform:scale(1.04)}
.bottom{font-size:12px;text-align:center;opacity:.55;margin-top:12px}
@media(min-width:1500px){main{padding-top:36px}.collection{margin-top:32px}.rail{min-height:595px}}
@media(max-width:720px){
 main{padding:24px 0 20px;min-height:100svh}
 main::before{top:-1%;right:-20%;width:85vw;height:75vw;opacity:.12;filter:blur(9px)}
 h1{letter-spacing:-.064em;white-space:nowrap;margin:17px 0 8px;line-height:1.07}
 .lead{font-size:clamp(12px,3.4vw,16px);line-height:1.5;max-width:340px;white-space:normal}
 .signup{width:calc(100vw - 46px);max-width:490px;height:56px;margin-top:18px}
 .signup input{font-size:14px;padding:0 18px}
 .signup button{font-size:14px;padding:0 24px}
 .collection{margin-top:34px}
 .rail{min-height:clamp(380px,109vw,530px);gap:8px;padding-left:0;padding-right:0;padding-bottom:0}
 .garment{flex-basis:clamp(151px,42vw,210px);height:clamp(350px,105vw,510px)}
 .garment.long img{height:clamp(350px,100vw,495px)}
 .garment.short img{height:clamp(265px,76vw,360px)}
 .nav{width:39px;height:39px;top:45%}
 .rail .garment:nth-child(3){order:3}.rail .garment:nth-child(4){order:2}.rail .garment:nth-child(1){order:0}.rail .garment:nth-child(2){order:1}.rail .garment:nth-child(n+5){order:4}
 .nav.prev{left:12px}.nav.next{right:12px}
 .nav svg{width:18px;height:18px}
 .progress{display:flex;margin-top:3px;gap:13px}
 .bottom{margin-top:12px;font-size:11px}
}
@media(max-width:370px){main{padding-top:24px}h1{margin-top:14px}.lead{font-size:12px}.signup{margin-top:17px;height:54px}.signup button{padding:0 19px}.collection{margin-top:18px}.rail{min-height:375px}}
@media(prefers-reduced-motion:reduce){html,.rail{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}

/* Phone waitlist enhancements: preserve the approved layout */
.signup{position:relative}
.signup .honeypot{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important}
.signup button:disabled{opacity:.55;cursor:wait}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:15px;text-align:left;width:min(566px,calc(100% - 62px));font-size:12px;line-height:1.45;color:#655e51;cursor:pointer}
.consent input{margin:2px 0 0;flex:none;width:15px;height:15px;accent-color:#14120f;cursor:pointer}
.signup-status{font-size:12px;line-height:1.35;min-height:14px;margin:7px 0 0;max-width:560px;color:#4d493f}
.signup-status.error{color:#8c3426}
@media(max-width:720px){.consent{width:calc(100vw - 58px);max-width:455px;font-size:11px;margin-top:13px;gap:8px}.signup-status{width:calc(100vw - 58px);font-size:11px}}

.consent a{color:#11100e;text-underline-offset:3px;text-decoration-thickness:1px;}
.consent a:focus-visible{outline:2px solid #11100e;outline-offset:3px}

/* Version 3: rail, tagged garments and extremely subtle movement cue. */
.collection{margin-top:30px;isolation:isolate}
.clothing-rod{position:absolute;top:48px;left:-3px;right:-3px;height:10px;z-index:0;pointer-events:none;border-top:1px solid rgba(88,76,58,.48);border-bottom:1px solid rgba(84,73,55,.25);background:linear-gradient(to bottom,#5b5750 0%,#beb9ac 18%,#f9f8e8 39%,#8b887d 58%,#615c50 83%,#b4aa90 100%);box-shadow:0 2px 4px rgba(69,60,43,.11),0 -1px 2px rgba(255,255,255,.4)}
.rail{position:relative;z-index:1;scrollbar-width:none;scroll-snap-type:none;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 4.5%,#000 95.5%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 4.5%,#000 95.5%,transparent 100%)}
.garment img{position:relative;z-index:1}
.soon-tag{position:absolute;top:93px;left:calc(50% + 34px);z-index:3;min-width:63px;padding:10px 11px 9px;background:#f8f0dd;border:1px solid #e2d6bc;box-shadow:0 5px 12px rgba(68,56,38,.10);color:#28231d;font-family:var(--display);font-size:12px;font-weight:500;letter-spacing:.14em;line-height:1;transform:rotate(9deg);pointer-events:none;white-space:nowrap}
.soon-tag::before{content:'';position:absolute;height:34px;top:-34px;left:8px;border-left:1px solid #aa9980;transform-origin:bottom;transform:rotate(-20deg)}
.soon-tag::after{content:'';position:absolute;top:4px;left:6px;width:4px;height:4px;background:#baaa90;border-radius:50%}
@media(max-width:720px){
 .collection{margin-top:14px}
 .clothing-rod{top:34px;height:8px}
 .rail{-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0%,#000 7%,#000 93%,transparent 100%)}
 .soon-tag{top:71px;left:calc(50% + 17px);padding:7px 8px 6px;min-width:45px;font-size:9px;letter-spacing:.14em;transform:rotate(8deg)}
 .soon-tag::before{height:23px;top:-23px}
}
@media(max-width:370px){.clothing-rod{top:34px}.soon-tag{top:65px}}
</style>
</head>

<script>
(()=>{
 const rail=document.getElementById('rail'),items=[...rail.querySelectorAll('.garment')],form=document.getElementById('signup');
 const isMobile=()=>matchMedia('(max-width:720px)').matches;
 const step=()=>items[0].getBoundingClientRect().width+parseFloat(getComputedStyle(rail).gap||'0');
 rail.addEventListener('keydown',e=>{
   if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
     e.preventDefault();cancelHint();
     rail.scrollBy({left:(e.key==='ArrowRight'?1:-1)*step(),behavior:'smooth'});
   }
 });
 // Desktop: click-drag. Mobile: native touch swipe. No visible navigation controls.
 let pressed=false,startX=0,startingScroll=0;
 rail.addEventListener('pointerdown',e=>{
   cancelHint(); if(e.pointerType==='touch')return;
   pressed=true;startX=e.clientX;startingScroll=rail.scrollLeft;
   rail.classList.add('dragging');
 });
 window.addEventListener('pointermove',e=>{if(pressed)rail.scrollLeft=startingScroll-(e.clientX-startX)});
 function release(){pressed=false;rail.classList.remove('dragging')}
 window.addEventListener('pointerup',release);
 window.addEventListener('pointercancel',release);
 window.addEventListener('blur',release);
 rail.addEventListener('dragstart',e=>e.preventDefault());
 rail.addEventListener('touchstart',cancelHint,{passive:true});
 rail.addEventListener('wheel',e=>{cancelHint();if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;if(e.shiftKey){e.preventDefault();rail.scrollLeft+=e.deltaY;}},{passive:false});
 // One-time carousel peek: a 52–60px sideways nudge and a soft return.
 // This demonstrates the gesture without visible arrows, dots or instruction text.
 let hintTimer=0, hintFrame=0, hintCancelled=false, hintPlayed=false;
 function cancelHint(){
   hintCancelled=true;
   if(hintTimer)window.clearTimeout(hintTimer);
   if(hintFrame)window.cancelAnimationFrame(hintFrame);
   hintTimer=0;hintFrame=0;
 }
 const easing=t=>1-Math.pow(1-t,3);
 function nudge(){
   if(hintCancelled||hintPlayed||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
   if(document.visibilityState==='hidden')return;
   if(rail.scrollWidth-rail.clientWidth<120)return;
   hintPlayed=true;
   const start=rail.scrollLeft;
   const room=rail.scrollWidth-rail.clientWidth-start;
   const shift=Math.min(isMobile()?52:60,room-12);
   if(shift<30)return;
   const duration=1670;
   const previous=rail.style.scrollBehavior;
   rail.style.scrollBehavior='auto';
   let began=0;
   const frame=now=>{
     if(hintCancelled){rail.style.scrollBehavior=previous;return}
     if(!began)began=now;
     const t=Math.min((now-began)/duration,1);
     let progress;
     if(t<.42) progress=easing(t/.42);
     else if(t<.55) progress=1;
     else progress=1-easing((t-.55)/.45);
     rail.scrollLeft=start+shift*progress;
     if(t<1){hintFrame=window.requestAnimationFrame(frame)}
     else {rail.scrollLeft=start;rail.style.scrollBehavior=previous;hintFrame=0}
   };
   hintFrame=window.requestAnimationFrame(frame);
 }
 function hint(){
   if(hintCancelled||hintPlayed||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
   // Play only when the rail is actually onscreen, not while the viewer is elsewhere.
   const observer=new IntersectionObserver(entries=>{
      if(entries.some(entry=>entry.isIntersecting&&entry.intersectionRatio>.23)){
         observer.disconnect();
         hintTimer=window.setTimeout(nudge,900);
      }
   },{threshold:[.23,.3,.5]});
   observer.observe(rail);
 }
 // Real collector: POST to a server-side endpoint. Never claim success unless the server saves it.
 const LEGAL_VERSION='2026-11-12';
 const phoneField=document.getElementById('phone'),consentField=document.getElementById('consent'),submitButton=document.getElementById('signup-button'),statusNode=document.getElementById('signup-status');
 const normalizePhone=(raw)=>{
   let p=String(raw||'').replace(/[\s().-]/g,'');
   if(/^03\d{9}$/.test(p))p='+92'+p.slice(1);
   else if(/^3\d{9}$/.test(p))p='+92'+p;
   else if(/^923\d{9}$/.test(p))p='+'+p;
   if(!/^\+[1-9]\d{7,14}$/.test(p))return null;
   if(p.startsWith('+92')&&!/^\+923\d{9}$/.test(p))return null;
   return p;
 };
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const phone=normalizePhone(phoneField.value);
   statusNode.classList.remove('error');
   if(!phone){statusNode.textContent='Enter a valid phone number, such as 0300 1234567.';statusNode.classList.add('error');phoneField.focus();return;}
   if(!consentField.checked){statusNode.textContent='Please tick the box to consent to launch notifications and acknowledge the terms.';statusNode.classList.add('error');consentField.focus();return;}
   submitButton.disabled=true;submitButton.textContent='Saving…';statusNode.textContent='';
   try {
     const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);
     let response;
     try {response=await fetch('/api/waitlist',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({phone,consent:true,legalVersion:LEGAL_VERSION,website:form.elements.website.value}),signal:controller.signal});}
     finally {clearTimeout(timeout)}
     const data=await response.json().catch(()=>({}));
     if(!response.ok||data.ok!==true)throw new Error(data.error||'Could not save your number. Try again.');
     form.reset();statusNode.textContent='You’re on the launch list. We’ll be in touch.';
   } catch(error){
     statusNode.classList.add('error');
     statusNode.textContent=error.name==='AbortError'?'Request timed out. Please try again.':error instanceof TypeError?'Could not connect. Please try again.':'Could not save your number. Please try again.';
   } finally {submitButton.disabled=false;submitButton.textContent='Notify Me';}
 });
 // Start with a partially cropped garment on either edge; cue scrollability once.
 function initial(){
   rail.style.scrollBehavior='auto';
   rail.scrollLeft=isMobile()?Math.max(0,items[1].offsetLeft-rail.clientWidth*.11):Math.max(0,items[1].offsetLeft-rail.clientWidth*.10);
   rail.style.scrollBehavior='';
   hint();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(initial));
 else requestAnimationFrame(initial);
})();
</script>
